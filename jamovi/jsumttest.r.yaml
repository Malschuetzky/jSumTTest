---
name:  jSumTTest
title: Summary Data
jrs:   '1.1'

items:
#    - name:  text
#      title: Two Independent Samples Tests for Summary Data
#      type:  Preformatted

## for independent samples results:
    - name: ttesttable
      title: Independent Samples Test for Summary Data
      visible: (testselect:ttest_is)
      type: Table
      rows:  2
      
      clearWith:
        - M1
        - SD1
        - n1
        - M2
        - SD2
        - n2

      columns:
        - name: var
          title: ''
          type: text
          
        - name: t
          title: t
          type: number
          
        - name: df
          title: df
          type: number
          
        - name: p
          title: p
          type: number
          format: zto,pvalue
          
        - name: d
          title: Cohen&rsquo;s d
          type: number
          visible: (d_show)

        - name: CI_d_low
          title: Lower
          type: number
          visible: (d_show && CI_d_show)

        - name: CI_d_upp
          title: Upper
          type: number
          visible: (d_show && CI_d_show)
          
        - name: deltaM
          title: '&Delta;M'
          type: number
          visible: (deltaM_show)
          
        - name: SE_deltaM
          title: SE(&Delta;M)
          type: number
          visible: (deltaM_show && SE_deltaM_show)
          
        - name: CI_deltaM_low
          title: Lower
        #  superTitle: Confidence Interval
          type: number
          visible: (deltaM_show && CI_deltaM_show)

        - name: CI_deltaM_upp
          title: Upper
        #  superTitle: Confidence Interval
          type: number
          visible: (deltaM_show && CI_deltaM_show)
      notes:
        1: INI
      refs:
        - jSumTTest
        - psych-R
        
          
    - name: desctable
      title: Sample descriptives
      visible: (desc_show && testselect:ttest_is)
      type: Table
      rows:  2
      
      clearWith:
        - M1
        - SD1
        - n1
        - M2
        - SD2
        - n2
      
      columns:
        - name: group
          title: Sample
          type: text
          
        - name: n
          title: n
          type: integer
          
        - name: M
          title: M
          type: number
          
        - name: SD
          title: SD
          type: number
          
        - name: SE
          title: SE(M)
          type: number
          visible: (desc_show && SE_M_show)
          
        - name: CI_M_low
          title: Lower
        #  superTitle: Confidence Interval
          type: number
          visible: (desc_show && CI_M_show)

        - name: CI_M_upp
          title: Upper
        #  superTitle: Confidence Interval
          type: number
          visible: (desc_show && CI_M_show)
      refs:
        - jSumTTest


## for one-sample results:
    - name: ttesttable_os
      title: One-sample Test for Summary Data
      visible: (testselect:ttest_os)
      type: Table
      rows:  1
      
      clearWith:
        - M_os
        - SD_os
        - n_os
        - testvalue_os

      columns:
        - name: var
          title: ''
          type: text
          
        - name: t
          title: t
          type: number
          
        - name: df
          title: df
          type: number
          
        - name: p
          title: p
          type: number
          format: zto,pvalue
          
        - name: d_dagger
          title: Cohen's d<sup>&dagger;</sup>
          type: number
          visible: (d_show)
          
        - name: CI_d_dagger_low
          title: Lower
          type: number
          visible: (d_show && CI_d_show)

        - name: CI_d_dagger_upp
          title: Upper
          type: number
          visible: (d_show && CI_d_show)
          
        - name: d
          title: Cohen's d
          type: number
          visible: (d_show)
          
        - name: CI_d_low
          title: Lower
          type: number
          visible: (d_show && CI_d_show)

        - name: CI_d_upp
          title: Upper
          type: number
          visible: (d_show && CI_d_show)
          
        - name: deltaM
          title: '&Delta;M'
          type: number
          visible: (deltaM_show)
          
        - name: CI_deltaM_low
          title: Lower
        #  superTitle: Confidence Interval
          type: number
          visible: (deltaM_show && CI_deltaM_show)

        - name: CI_deltaM_upp
          title: Upper
        #  superTitle: Confidence Interval
          type: number
          visible: (deltaM_show && CI_deltaM_show)
      notes:
        1: INI
      refs:
        - jSumTTest


    - name: desctable_os
      title: Sample descriptives & test value
      visible: (desc_show && testselect:ttest_os)
      type: Table
      rows:  2
      
      clearWith:
        - M_os
        - SD_os
        - n_os
        - testvalue_os

      columns:
        - name: group
          title: ''
          type: text
          
        - name: n
          title: n
          type: integer
          
        - name: M
          title: M
          type: number
          
        - name: SD
          title: SD
          type: number
          
        - name: SE
          title: SE(M)
          type: number
          visible: (desc_show && SE_M_show)
          
        - name: CI_M_low
          title: Lower
        #  superTitle: Confidence Interval
          type: number
          visible: (desc_show && CI_M_show)

        - name: CI_M_upp
          title: Upper
        #  superTitle: Confidence Interval
          type: number
          visible: (desc_show && CI_M_show)
#      notes:
#        1: INI
      refs:
        - jSumTTest


    - name: plot
      title: Descriptives Plot (mean and % CI)
      type: Image
      width: 400
      height: 300
      renderFun: .plot
      visible: (dplot_show)
      refs:
        - jSumTTest
        - ggplot2
      clearWith:
        - M1
        - SD1
        - n1
        - name1
        - M2
        - SD2
        - n2
        - name2
        - CI_M_width
        - M_os
        - SD_os
        - n_os
        - testvalue_os
        - testselect
        - pop_var
      
